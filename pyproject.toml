[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqli-ai-detector"
version = "2.0.0"
description = "AI-powered SQL Injection Threat Detection & SOC Monitoring Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "joblib>=1.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
